unregistered_fields:
- field: <envelope>.object_type
  reason: Canonical class names (Data Model §3.1, Annex C); not an enumerated value list in the Data Model.
- field: <envelope>.status
  reason: Per-class lifecycle; registered here only where the Data Model lists values (case_status, evidence_item_status,
    claim_status, fact_status, etc.).
- field: Case.risk_rating
  reason: Declared enum with no values in Data Model v0.1.1 — open item.
- field: Case.closure_reason
  reason: Declared enum with no values in Data Model v0.1.1 — open item.
- field: InvestigationQuestion.priority
  reason: Declared enum with no values in Data Model v0.1.1 — open item.
- field: Claim.credibility_grade
  reason: 'Numeric grades 1-6 (Data Model §14: 1 independently confirmed; 2 probably true; 3 possibly true; 4 doubtful;
    5 improbable; 6 cannot be judged). Codes are digits, outside the UPPER_SNAKE_CASE pattern; decision needed whether
    to keep digit codes or define wire names.'
- field: Source.lawful_access_basis
  reason: text/enum with no values listed.
- field: Asset.valuation_basis
  reason: enum/text; prose examples only (registry, market estimate, appraisal, reported value).
- field: IntelligenceProduct.audience
  reason: enum/string[] with no values listed.
- field: RetentionRule.applies_to
  reason: 'enum/ref: object type (see object_type) or object reference.'
