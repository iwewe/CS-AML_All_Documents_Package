# CS-AML controlled wire-enumeration registry (machine source of truth)  [v0.1.1 · A09] [v0.1.2 · CR-I1-02, CR-I1-08, CR-I2-02, CR-I2-03, CR-I2-08, CR-I3-05, CR-I3-06, CR-I4-06, CR-I4-07]
# [v0.1.3 · CR-I5-03, CR-I5-05, CR-I5-06, CR-I6-02, CR-I6-03, CR-I6-04, CR-I6-06, CR-I6-08, CR-I6-09, CR-I6-12, CR-I7-02, CR-I7-03, CR-I7-04]
# Derived from Data Model Specification v0.1.3 Annex A and the enum rows of its field tables,
# the Typology Catalogue v0.1.2 (§3, §4, §5, §8) and the round-2 decisions approved by the product
# owner on 2026-10-08 (A10 Claim/Fact, ER ResolutionDecision). v0.1.2 (2026-10-09) adds the value sets of the
# approved change requests (CHANGELOG.md v0.1.2, section B); v0.1.3 (2026-10-09) adds the value sets of
# CR-I5-01…CR-I7-08 (CHANGELOG.md v0.1.3), exactly as the reference implementation uses them. API error codes
# are not enums here.
# Documents and contracts/openapi.yaml SHALL use exactly these values. See schemas/README.md.
registry_version: 0.1.3
source: Documents/CS-AML_Data_Model_Specification_v0.1.3.md Annex A
conventions:
  value_pattern: ^[A-Z][A-Z0-9_]*$
  labels: Display labels are presentation strings (translatable) and SHALL NOT be stored or exchanged in place of
    wire values.
  ordered: 'ordered: true means values are listed least -> most (rank 1 = lowest); ordered: false means no ranking
    may be inferred from list order.'
  wire: 'wire: code (credibility_grade only) is a registry exception: the wire value is each entry''s `code`, and
    `value` is the registry name. Every other enum exchanges `value`.'
  legacy_values: Pre-v0.1.1 spellings accepted only by migration tooling, never emitted on the wire.
enums:
  classification:
    description: Information sensitivity classification (authoritative model, D-A08).
    used_by:
    - <envelope>.classification
    - IntelligenceProduct.classification
    ordered: true
    source: Documents/CS-AML_Data_Model_Specification_v0.1.3.md §4, §16, Annex A
    note: rank 1 = least restrictive, 5 = most restrictive. Unknown, missing or unrecognized values fail closed
      (deny access, flag for classification). Access labels are additive. Derived objects inherit the highest input
      classification unless a recorded reviewer downgrade exists. Framework v0.1 legacy labels map per Data Model
      §16 (Restricted / Highly Restricted never auto-mapped).
    values:
    - value: PUBLIC
      label: Public
      description: Suitable for public release after normal review.
      rank: 1
    - value: INTERNAL
      label: Internal
      description: Routine internal operational information.
      rank: 2
    - value: SENSITIVE
      label: Sensitive
      description: Could create privacy, reputational, safety, or investigative harm if disclosed.
      rank: 3
    - value: RESTRICTED
      label: Restricted
      description: High-risk information requiring named-role or case-specific authorization.
      rank: 4
    - value: SOURCE_PROTECTED
      label: Source-protected
      legacy_values:
      - SOURCE-PROTECTED
      description: Information whose disclosure could identify or endanger a confidential source.
      rank: 5
  confidence_level:
    description: Analyst confidence level of a Confidence object.
    used_by:
    - Confidence.level
    ordered: false
    source: Documents/CS-AML_Data_Model_Specification_v0.1.3.md §14, §14.1, Annex A
    note: 'HIGH > MODERATE > LOW is a scale, but INSUFFICIENT_BASIS is NOT ordered below LOW and SHALL NOT be converted
      to LOW, null, zero or omitted; therefore the enum as a whole is ordered: false. null is allowed only on drafts
      where no confidence judgement has been made; finalized objects carry a non-null level. Rationale (Confidence.basis)
      is mandatory for every level. No normalization may raise certainty.'
    nullable: true
    values:
    - value: HIGH
      label: High
    - value: MODERATE
      label: Moderate
    - value: LOW
      label: Low
    - value: INSUFFICIENT_BASIS
      label: Insufficient basis
      description: A judgement was attempted but the evidential basis is insufficient. Not a level below LOW.
  source_diversity:
    description: Diversity of sources underlying a confidence judgement.
    used_by:
    - Confidence.source_diversity
    ordered: false
    source: Documents/CS-AML_Data_Model_Specification_v0.1.3.md §14.1
    values:
    - value: SINGLE
      label: Single
    - value: MULTIPLE_RELATED
      label: Multiple related
    - value: MULTIPLE_INDEPENDENT
      label: Multiple independent
  case_status:
    description: Case lifecycle state (envelope status for Case).
    used_by:
    - Case.status
    ordered: false
    source: Documents/CS-AML_Data_Model_Specification_v0.1.3.md §6.1 Lifecycle states
    note: Lifecycle sequence DRAFT -> AUTHORIZED -> ACTIVE -> REVIEW -> CLOSED -> MONITORING -> REOPENED; a state
      machine, not a ranked scale.
    values:
    - value: DRAFT
      label: Draft
    - value: AUTHORIZED
      label: Authorized
    - value: ACTIVE
      label: Active
    - value: REVIEW
      label: Review
    - value: CLOSED
      label: Closed
    - value: MONITORING
      label: Monitoring
    - value: REOPENED
      label: Reopened
  investigation_question_status:
    description: Status of an InvestigationQuestion.
    used_by:
    - InvestigationQuestion.status
    ordered: false
    source: Documents/CS-AML_Data_Model_Specification_v0.1.3.md §6.2
    values:
    - value: OPEN
      label: Open
    - value: ANSWERED
      label: Answered
    - value: RETIRED
      label: Retired
  source_type:
    description: Type of information Source.
    used_by:
    - Source.source_type
    ordered: false
    source: Documents/CS-AML_Data_Model_Specification_v0.1.3.md §7.1
    values:
    - value: REGISTRY
      label: Registry
    - value: COURT_RECORD
      label: Court record
    - value: MEDIA
      label: Media
    - value: WHISTLEBLOWER
      label: Whistleblower
    - value: WEBSITE
      label: Website
    - value: DATASET
      label: Dataset
    - value: DOCUMENT
      label: Document
    - value: INTERVIEW
      label: Interview
    - value: OTHER
      label: Other
  source_reliability_grade:
    description: Source reliability grade (separate from information credibility and analyst confidence).
    used_by:
    - Source.reliability_grade
    ordered: false
    source: Documents/CS-AML_Data_Model_Specification_v0.1.3.md §7.1, §14
    note: 'Labels are the letters; F means unknown and is not a rank below E, hence ordered: false.'
    values:
    - value: A
      label: Grade A
      description: Highly reliable.
    - value: B
      label: Grade B
      description: Generally reliable.
    - value: C
      label: Grade C
      description: Mixed.
    - value: D
      label: Grade D
      description: Generally unreliable.
    - value: E
      label: Grade E
      description: Unreliable.
    - value: F
      label: Grade F
      description: Unknown (reliability cannot be judged).
  evidence_type:
    description: Type of EvidenceItem.
    used_by:
    - EvidenceItem.evidence_type
    ordered: false
    source: Documents/CS-AML_Data_Model_Specification_v0.1.3.md §7.2
    values:
    - value: DOCUMENT
      label: Document
    - value: IMAGE
      label: Image
    - value: RECORD
      label: Record
    - value: TRANSCRIPT
      label: Transcript
    - value: DATASET_ROW
      label: Dataset row
    - value: WEB_SNAPSHOT
      label: Web snapshot
    - value: OTHER
