    description: Type of organization.
    used_by:
    - OrganizationProfile.organization_type
    ordered: false
    source: Documents/CS-AML_Data_Model_Specification_v0.1.1.md §8.3
    values:
    - value: COMPANY
      label: Company
    - value: NGO
      label: NGO
    - value: GOVERNMENT
