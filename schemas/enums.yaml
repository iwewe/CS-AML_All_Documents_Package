  evidence_item_status:
    description: EvidenceItem lifecycle state (envelope status for EvidenceItem).
    used_by:
    - EvidenceItem.status
    ordered: false
    source: Documents/CS-AML_Data_Model_Specification_v0.1.3.md §7.2 Lifecycle states
    note: Lifecycle sequence COLLECTED -> REGISTERED -> VERIFIED -> SUPERSEDED -> RESTRICTED.
    values:
    - value: COLLECTED
      label: Collected
    - value: REGISTERED
      label: Registered
    - value: VERIFIED
      label: Verified
    - value: SUPERSEDED
      label: Superseded
    - value: RESTRICTED
      label: Restricted
  claim_status:
    description: Status of a Claim (A10, approved by product owner 2026-10-08). The Claim assertion itself is never
      overwritten.
    used_by:
    - Claim.claim_status
    ordered: false
    source: Documents/CS-AML_Data_Model_Specification_v0.1.3.md §7.4, Annex A
    note: Every transition out of RECORDED is backed by a VerificationDecision. A Claim never becomes a Fact.
    values:
    - value: RECORDED
      label: Recorded
      description: Assertion recorded with attribution; no verification decision yet.
    - value: UNDER_REVIEW
      label: Under review
    - value: CORROBORATED
      label: Corroborated
    - value: CONTRADICTED
      label: Contradicted
      description: Also sets the compatibility field Claim.disputed = true.
    - value: UNRESOLVED
      label: Unresolved
  fact_status:
    description: Status of a Fact (A10, approved by product owner 2026-10-08).
    used_by:
    - Fact.fact_status
    ordered: false
    source: Documents/CS-AML_Data_Model_Specification_v0.1.3.md §7.5, Annex A
    values:
    - value: PROVISIONAL
      label: Provisional
      description: Initial state of a newly created Fact.
    - value: ESTABLISHED
      label: Established
      description: Requires a reviewer other than the proposer.
    - value: DISPUTED
      label: Disputed
    - value: SUPERSEDED
      label: Superseded
      description: Requires Fact.superseded_by.
  verification_decision:
    description: Outcome recorded by an append-only VerificationDecision on a Claim or a Fact.
    used_by:
    - VerificationDecision.decision
    ordered: false
    source: Documents/CS-AML_Data_Model_Specification_v0.1.3.md §7.6, Annex A
    note: Claim decisions are claim_status values; Fact decisions are fact actions. A decision value SHALL match
      the target type (applies_to).
    values:
    - value: UNDER_REVIEW
      label: Under review
      applies_to: CLAIM
    - value: CORROBORATED
      label: Corroborated
      applies_to: CLAIM
    - value: CONTRADICTED
      label: Contradicted
      applies_to: CLAIM
    - value: UNRESOLVED
      label: Unresolved
      applies_to: CLAIM
    - value: CREATE
      label: Create fact
      applies_to: FACT
      description: 'Fact creation: creates a new PROVISIONAL Fact supported by the referenced claims and/or evidence.
        It does not convert, alter or close any Claim. (Draft name PROMOTE retired on 2026-10-08.)'
    - value: ESTABLISH
      label: Establish
      applies_to: FACT
    - value: DISPUTE
      label: Dispute
      applies_to: FACT
    - value: SUPERSEDE
      label: Supersede
      applies_to: FACT
  entity_type:
