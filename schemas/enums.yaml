# CS-AML controlled wire-enumeration registry (machine source of truth)  [v0.1.1 · A09]
# Derived from Data Model Specification v0.1.1 Annex A and the enum rows of its field tables,
# the Typology Catalogue v0.1.1 (§3, §4, §5, §8) and the round-2 decisions approved by the product
# owner on 2026-10-08 (A10 Claim/Fact, ER ResolutionDecision). API error codes are not enums here.
# Documents and contracts/openapi.yaml SHALL use exactly these values. See schemas/README.md.
registry_version: 0.1.1
source: Documents/CS-AML_Data_Model_Specification_v0.1.1.md Annex A
conventions:
  value_pattern: ^[A-Z][A-Z0-9_]*$
  labels: Display labels are presentation strings (translatable) and SHALL NOT be stored or exchanged in place of
    wire values.
  ordered: 'ordered: true means values are listed least -> most (rank 1 = lowest); ordered: false means no ranking
    may be inferred from list order.'
  legacy_values: Pre-v0.1.1 spellings accepted only by migration tooling, never emitted on the wire.
enums:
  classification:
    description: Information sensitivity classification (authoritative model, D-A08).
    used_by:
    - <envelope>.classification
    - IntelligenceProduct.classification
    ordered: true
    source: Documents/CS-AML_Data_Model_Specification_v0.1.1.md §4, §16, Annex A
    note: rank 1 = least restrictive, 5 = most restrictive. Unknown, missing or unrecognized values fail closed
      (deny access, flag for classification). Access labels are additive. Derived objects inherit the highest input
      classification unless a recorded reviewer downgrade exists. Framework v0.1 legacy labels map per Data Model
      §16 (Restricted / Highly Restricted never auto-mapped).
    values:
    - value: PUBLIC
      label: Public
      description: Suitable for public release after normal review.
      rank: 1
    - value: INTERNAL
      label: Internal
      description: Routine internal operational information.
      rank: 2
    - value: SENSITIVE
      label: Sensitive
      description: Could create privacy, reputational, safety, or investigative harm if disclosed.
      rank: 3
    - value: RESTRICTED
      label: Restricted
      description: High-risk information requiring named-role or case-specific authorization.
      rank: 4
    - value: SOURCE_PROTECTED
      label: Source-protected
      legacy_values:
      - SOURCE-PROTECTED
      description: Information whose disclosure could identify or endanger a confidential source.
      rank: 5
  confidence_level:
    description: Analyst confidence level of a Confidence object.
    used_by:
    - Confidence.level
    ordered: false
    source: Documents/CS-AML_Data_Model_Specification_v0.1.1.md §14, §14.1, Annex A
    note: 'HIGH > MODERATE > LOW is a scale, but INSUFFICIENT_BASIS is NOT ordered below LOW and SHALL NOT be converted
      to LOW, null, zero or omitted; therefore the enum as a whole is ordered: false. null is allowed only on drafts
      where no confidence judgement has been made; finalized objects carry a non-null level. Rationale (Confidence.basis)
      is mandatory for every level. No normalization may raise certainty.'
    nullable: true
    values:
    - value: HIGH
      label: High
    - value: MODERATE
      label: Moderate
    - value: LOW
      label: Low
    - value: INSUFFICIENT_BASIS
      label: Insufficient basis
      description: A judgement was attempted but the evidential basis is insufficient. Not a level below LOW.
  source_diversity:
    description: Diversity of sources underlying a confidence judgement.
    used_by:
    - Confidence.source_diversity
    ordered: false
    source: Documents/CS-AML_Data_Model_Specification_v0.1.1.md §14.1
    values:
    - value: SINGLE
      label: Single
    - value: MULTIPLE_RELATED
      label: Multiple related
    - value: MULTIPLE_INDEPENDENT
      label: Multiple independent
  case_status:
    description: Case lifecycle state (envelope status for Case).
    used_by:
    - Case.status
    ordered: false
    source: Documents/CS-AML_Data_Model_Specification_v0.1.1.md §6.1 Lifecycle states
    note: Lifecycle sequence DRAFT -> AUTHORIZED -> ACTIVE -> REVIEW -> CLOSED -> MONITORING -> REOPENED; a state
      machine, not a ranked scale.
    values:
    - value: DRAFT
      label: Draft
    - value: AUTHORIZED
      label: Authorized
    - value: ACTIVE
      label: Active
    - value: REVIEW
      label: Review
    - value: CLOSED
      label: Closed
    - value: MONITORING
      label: Monitoring
    - value: REOPENED
      label: Reopened
  investigation_question_status:
    description: Status of an InvestigationQuestion.
    used_by:
    - InvestigationQuestion.status
    ordered: false
    source: Documents/CS-AML_Data_Model_Specification_v0.1.1.md §6.2
    values:
    - value: OPEN
      label: Open
    - value: ANSWERED
      label: Answered
    - value: RETIRED
      label: Retired
  source_type:
    description: Type of information Source.
    used_by:
    - Source.source_type
    ordered: false
    source: Documents/CS-AML_Data_Model_Specification_v0.1.1.md §7.1
    values:
    - value: REGISTRY
      label: Registry
    - value: COURT_RECORD
      label: Court record
    - value: MEDIA
      label: Media
    - value: WHISTLEBLOWER
      label: Whistleblower
    - value: WEBSITE
      label: Website
    - value: DATASET
      label: Dataset
    - value: DOCUMENT
      label: Document
    - value: INTERVIEW
      label: Interview
    - value: OTHER
      label: Other
  source_reliability_grade:
    description: Source reliability grade (separate from information credibility and analyst confidence).
    used_by:
    - Source.reliability_grade
    ordered: false
    source: Documents/CS-AML_Data_Model_Specification_v0.1.1.md §7.1, §14
    note: 'Labels are the letters; F means unknown and is not a rank below E, hence ordered: false.'
    values:
    - value: A
      label: Grade A
      description: Highly reliable.
    - value: B
      label: Grade B
      description: Generally reliable.
    - value: C
      label: Grade C
      description: Mixed.
    - value: D
      label: Grade D
      description: Generally unreliable.
    - value: E
      label: Grade E
      description: Unreliable.
    - value: F
      label: Grade F
      description: Unknown (reliability cannot be judged).
  evidence_type:
    description: Type of EvidenceItem.
    used_by:
    - EvidenceItem.evidence_type
    ordered: false
    source: Documents/CS-AML_Data_Model_Specification_v0.1.1.md §7.2
    values:
    - value: DOCUMENT
      label: Document
    - value: IMAGE
      label: Image
    - value: RECORD
      label: Record
    - value: TRANSCRIPT
      label: Transcript
    - value: DATASET_ROW
      label: Dataset row
    - value: WEB_SNAPSHOT
      label: Web snapshot
    - value: OTHER
      label: Other
  evidence_verification_status:
    description: Verification status of an EvidenceItem.
    used_by:
    - EvidenceItem.verification_status
    ordered: false
    source: Documents/CS-AML_Data_Model_Specification_v0.1.1.md §7.2
    values:
    - value: UNVERIFIED
      label: Unverified
    - value: SOURCE_VERIFIED
      label: Source verified
    - value: INDEPENDENTLY_CORROBORATED
      label: Independently corroborated
    - value: DISPUTED
      label: Disputed
  redaction_state:
    description: Redaction state of an EvidenceItem.
    used_by:
    - EvidenceItem.redaction_state
    ordered: false
    source: Documents/CS-AML_Data_Model_Specification_v0.1.1.md §7.2
    values:
    - value: NONE
      label: None
    - value: WORKING_REDACTION
      label: Working redaction
    - value: PUBLICATION_REDACTION
      label: Publication redaction
  evidence_item_status:
    description: EvidenceItem lifecycle state (envelope status for EvidenceItem).
    used_by:
    - EvidenceItem.status
    ordered: false
    source: Documents/CS-AML_Data_Model_Specification_v0.1.1.md §7.2 Lifecycle states
    note: Lifecycle sequence COLLECTED -> REGISTERED -> VERIFIED -> SUPERSEDED -> RESTRICTED.
    values:
    - value: COLLECTED
      label: Collected
    - value: REGISTERED
      label: Registered
    - value: VERIFIED
      label: Verified
    - value: SUPERSEDED
      label: Superseded
    - value: RESTRICTED
      label: Restricted
  claim_status:
    description: Status of a Claim (A10, approved by product owner 2026-10-08). The Claim assertion itself is never
      overwritten.
    used_by:
    - Claim.claim_status
    ordered: false
    source: Documents/CS-AML_Data_Model_Specification_v0.1.1.md §7.4, Annex A
    note: Every transition out of RECORDED is backed by a VerificationDecision. A Claim never becomes a Fact.
    values:
    - value: RECORDED
      label: Recorded
      description: Assertion recorded with attribution; no verification decision yet.
    - value: UNDER_REVIEW
      label: Under review
    - value: CORROBORATED
      label: Corroborated
    - value: CONTRADICTED
      label: Contradicted
      description: Also sets the compatibility field Claim.disputed = true.
    - value: UNRESOLVED
      label: Unresolved
  fact_status:
    description: Status of a Fact (A10, approved by product owner 2026-10-08).
    used_by:
    - Fact.fact_status
    ordered: false
    source: Documents/CS-AML_Data_Model_Specification_v0.1.1.md §7.5, Annex A
    values:
    - value: PROVISIONAL
      label: Provisional
      description: Initial state of a newly created Fact.
    - value: ESTABLISHED
      label: Established
      description: Requires a reviewer other than the proposer.
    - value: DISPUTED
      label: Disputed
    - value: SUPERSEDED
      label: Superseded
      description: Requires Fact.superseded_by.
  verification_decision:
    description: Outcome recorded by an append-only VerificationDecision on a Claim or a Fact.
    used_by:
    - VerificationDecision.decision
    ordered: false
    source: Documents/CS-AML_Data_Model_Specification_v0.1.1.md §7.6, Annex A
    note: Claim decisions are claim_status values; Fact decisions are fact actions. A decision value SHALL match
      the target type (applies_to).
    values:
    - value: UNDER_REVIEW
      label: Under review
      applies_to: CLAIM
    - value: CORROBORATED
      label: Corroborated
      applies_to: CLAIM
    - value: CONTRADICTED
      label: Contradicted
      applies_to: CLAIM
    - value: UNRESOLVED
      label: Unresolved
      applies_to: CLAIM
    - value: CREATE
      label: Create fact
      applies_to: FACT
      description: 'Fact creation: creates a new PROVISIONAL Fact supported by the referenced claims and/or evidence.
        It does not convert, alter or close any Claim. (Draft name PROMOTE retired on 2026-10-08.)'
    - value: ESTABLISH
      label: Establish
      applies_to: FACT
    - value: DISPUTE
      label: Dispute
      applies_to: FACT
    - value: SUPERSEDE
      label: Supersede
      applies_to: FACT
  entity_type:
    description: Type of canonical Entity.
    used_by:
    - Entity.entity_type
    ordered: false
