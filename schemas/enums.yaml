unregistered_fields:
- field: <envelope>.object_type
  reason: Canonical class names (Data Model §3.1, Annex C); not an enumerated value list in the Data Model.
- field: <envelope>.status
  reason: Per-class lifecycle; classes without one use envelope_status (v0.1.2); the rest mirror their class status enum.
- field: InvestigationQuestion.priority
  reason: Declared enum with no values in Data Model v0.1.1 — open item.
- field: Source.lawful_access_basis
  reason: text/enum with no values listed.
- field: Asset.valuation_basis
  reason: Free text in v0.1.2, required when a valuation is given (CR-I3-06); vocabulary deferred to v0.2.
- field: EvidenceItem.derivation_type
  reason: Free text in v0.1.2 (redaction, OCR text, ...); vocabulary deferred to v0.2.
- field: Event status (Methodology §14.1 confirmed/probable/possible/disputed)
  reason: Not used by the implementation; deferred to v0.2 (CR-I3-05).
- field: IntelligenceProduct.audience
  reason: enum/string[] with no values listed.
