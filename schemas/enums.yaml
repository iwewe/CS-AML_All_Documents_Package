  indicator_class:
    description: Indicator class (CS-AML design convention).
    used_by:
    - Indicator.indicator_class
    - Typology Catalogue indicator sets (Class column, letter code)
    ordered: false
    source: Documents/CS-AML_Data_Model_Specification_v0.1.3.md §12.1; Documents/CS-AML_Typology_Catalogue_v0.1.2.md
      §5
    note: code is the catalogue display short code; the wire value is the UPPER_SNAKE_CASE value.
    values:
    - value: MECHANISM
      label: Mechanism-specific
      code: M
      description: Directly reflects how the typology operates; highest analytical weight.
    - value: CORROBORATING
      label: Corroborating
      code: C
      description: Supports a mechanism-specific indicator through an independent fact, relationship, event, or
        source.
    - value: CONTEXTUAL
      label: Contextual
      code: K
      description: Raises or lowers plausibility but is not specific enough to support a typology on its own.
    - value: DISCONFIRMING
      label: Disconfirming
      code: D
      description: Contradicts, weakens, or provides a more credible alternative explanation.
    - value: GAP
      label: Gap
      code: G
      description: Material information that is missing and limits confidence.
  indicator_status:
    description: Lifecycle status of a case-level Indicator object.
    used_by:
    - Indicator.status
    ordered: false
    source: Documents/CS-AML_Data_Model_Specification_v0.1.3.md §12.1
    note: Distinct from typology_indicator_observation_status, which records the per-typology assessment of whether
      a catalogue indicator is present.
    values:
    - value: OBSERVED
      label: Observed
    - value: CORROBORATED
      label: Corroborated
    - value: DISPUTED
      label: Disputed
    - value: RETIRED
      label: Retired
  typology_consistency_level:
    description: Consistency between case evidence and a catalogue typology. Expresses consistency, not guilt or
      legal classification.
    used_by:
    - TypologyMatch.consistency_level
    - Typology Catalogue §4 assessment level
    - Typology Catalogue §9 Assessment level
    ordered: true
    source: Documents/CS-AML_Data_Model_Specification_v0.1.3.md §12.2, Annex A; Documents/CS-AML_Typology_Catalogue_v0.1.2.md
      §4
    note: rank 1 = weakest. Above PLAUSIBLE requires more than a single indicator or single source unless direct
      authoritative evidence establishes the mechanism; STRONG/COMPELLING require a reviewer.
    values:
    - value: NO_BASIS
      label: No analytical basis
      description: No mechanism-specific indicator supported by reliable evidence.
      rank: 1
    - value: WEAK
      label: Weak consistency
      description: One or more generic indicators are present, but no mechanism-specific pattern is adequately corroborated.
      rank: 2
    - value: PLAUSIBLE
      label: Plausible consistency
      description: At least one mechanism-specific indicator plus independent corroborating evidence; material gaps
        remain.
      rank: 3
    - value: STRONG
      label: Strong consistency
      description: Multiple mutually reinforcing mechanism-specific indicators, independently supported, with alternative
        explanations assessed and materially weakened.
      rank: 4
    - value: COMPELLING
      label: Compelling consistency
      description: Direct or authoritative evidence establishes the mechanism or value movement and is corroborated
        by additional evidence. Does not determine criminal liability.
      rank: 5
