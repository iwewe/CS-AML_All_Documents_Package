  relationship_type:
    description: Canonical relationship vocabulary (baseline).
    used_by:
    - Relationship.relationship_type
    ordered: false
    source: Documents/CS-AML_Data_Model_Specification_v0.1.1.md §9.1, Annex B
    note: Directed relationships run from_entity -> to_entity (e.g. Person --DIRECTOR_OF--> Organization). Extensible
      only through registry change control. [v0.1.1 · C09] Ten values were registered from the Investigation Methodology §13,
      IA §10 and Framework Expanded §11.2 lists; other names in those lists are display synonyms mapped to registered
      values (see Data Model Annex B, mapping table).
    values:
    - value: OWNS
      label: Owns
      directionality: DIRECTED
      description: Legal ownership unless subtype says otherwise.
    - value: BENEFICIAL_OWNER_OF
      label: Beneficial owner of
      directionality: DIRECTED
      description: Beneficial ownership/economic interest.
    - value: CONTROLS
      label: Controls
      directionality: DIRECTED
      description: Control without requiring ownership.
    - value: DIRECTOR_OF
      label: Director of
      directionality: DIRECTED
      description: Corporate role; from Person to Organization (Person --DIRECTOR_OF--> Organization).
    - value: OFFICER_OF
      label: Officer of
      directionality: DIRECTED
      description: Organizational role.
    - value: EMPLOYED_BY
      label: Employed by
      directionality: DIRECTED
      description: Employment/role.
    - value: RELATED_TO
      label: Related to
      directionality: SYMMETRIC
      description: Familial/known relation; subtype required where possible.
    - value: ASSOCIATE_OF
      label: Associate of
      directionality: SYMMETRIC
      description: Documented association; SHALL NOT imply wrongdoing.
    - value: SHARES_ADDRESS_WITH
      label: Shares address with
      directionality: SYMMETRIC
      description: Common address.
    - value: SHARES_PHONE_WITH
      label: Shares phone with
      directionality: SYMMETRIC
      description: Common phone.
    - value: SHARES_DEVICE_WITH
      label: Shares device with
      directionality: SYMMETRIC
      description: Common device if lawfully obtained.
    - value: CONTRACTED_BY
      label: Contracted by
      directionality: DIRECTED
      description: Contract relationship.
    - value: SUPPLIER_TO
      label: Supplier to
      directionality: DIRECTED
      description: Supply relationship.
    - value: ACQUIRED
      label: Acquired
      directionality: DIRECTED
      description: Entity acquired asset.
    - value: SOLD_TO
      label: Sold to
      directionality: DIRECTED
      description: Asset transfer.
    - value: REPRESENTED_BY
      label: Represented by
      directionality: DIRECTED
      description: Professional/legal representation.
    - value: PAID_BY
      label: Paid by
      directionality: DIRECTED
      description: Documented payer relationship, not necessarily direct bank proof.
    # [v0.1.1 · C09] values below registered from Methodology §13, IA §10 and Framework Expanded §11.2.
    - value: AUTHORIZED_SIGNATORY_OF
      label: Authorized signatory of
      directionality: DIRECTED
      description: 'Signing authority; from Person to Organization or Account.'
    - value: COMMISSIONER_OF
      label: Commissioner of
      directionality: DIRECTED
      description: 'Supervisory-board (commissioner) role; from Person to Organization.'
    - value: MANAGES
      label: Manages
      directionality: DIRECTED
      description: 'Day-to-day management of an entity or asset without implying ownership or control.'
    - value: USES
      label: Uses
      directionality: DIRECTED
      description: 'Entity uses or occupies an asset without documented ownership.'
    - value: LENDER_TO
      label: Lender to
      directionality: DIRECTED
      description: 'Lending relationship; from lender to borrower.'
    - value: LEASED_TO
      label: Leased to
      directionality: DIRECTED
      description: 'Lease of an asset; from lessor to lessee.'
    - value: DONATED_TO
      label: Donated to
      directionality: DIRECTED
      description: 'Documented donation; from donor to recipient.'
    - value: FUNDED_BY
      label: Funded by
      directionality: DIRECTED
      description: 'Documented funding; from funded entity to funder.'
    - value: SHARES_DOMAIN_WITH
      label: Shares domain with
      directionality: SYMMETRIC
      description: 'Common internet domain or email domain.'
    - value: TRANSFERRED_VALUE_TO
      label: Transferred value to
      directionality: DIRECTED
      description: 'Value transfer from sender to receiver; requires evidence or clearly marked reconstruction (prefer ValueFlow where movement semantics are material).'
