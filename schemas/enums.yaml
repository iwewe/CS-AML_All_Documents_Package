    - value: AIRCRAFT
      label: Aircraft
    - value: CONTRACT
      label: Contract
    - value: PROJECT
      label: Project
    - value: OTHER
      label: Other
  entity_resolution_status:
    description: Entity resolution STATE (not a decision). Changes only as the effect of a ResolutionDecision.
    used_by:
    - Entity.resolution_status
    ordered: false
    source: Documents/CS-AML_Data_Model_Specification_v0.1.3.md §8.1, §8.4, Annex A
    values:
    - value: UNRESOLVED
      label: Unresolved
    - value: RESOLVED
      label: Resolved
    - value: CONFLICTED
      label: Conflicted
    - value: MERGED
      label: Merged
    - value: SPLIT
      label: Split
  resolution_decision:
    description: Decision about a pair/set of Entity records, recorded as an append-only ResolutionDecision (ER,
      approved by product owner 2026-10-08).
    used_by:
    - ResolutionDecision.decision
    ordered: false
    source: Documents/CS-AML_Data_Model_Specification_v0.1.3.md §8.4, Annex A
    note: legacy_values are the Investigation Methodology v0.1 §12.2 outcome names.
    values:
    - value: MERGE
      label: Merge
      legacy_values:
      - MERGED
      description: Absorbed records become MERGED (canonical_parent = surviving_entity_ref); survivor becomes RESOLVED.
        Requires surviving_entity_ref.
    - value: KEEP_SEPARATE
      label: Keep separate
      legacy_values:
      - SEPARATE
      description: No state change; the same pair is not re-suggested unless new evidence is attached.
    - value: POSSIBLE_MATCH
      label: Possible match
      legacy_values:
      - LINKED_POSSIBLE
      description: Candidate link recorded; no state change.
    - value: DEFER
      label: Defer
      legacy_values:
      - UNRESOLVED
      description: State stays or becomes UNRESOLVED.
    - value: UNMERGE
      label: Unmerge
      description: Restored records become SPLIT; relationships/claims re-attributed per recorded history. Requires
        reverses_decision_ref.
