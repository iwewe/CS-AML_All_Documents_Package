# CS-AML typology indicator source-mapping register  [v0.1.1 · A13]
#
# One record per indicator in the Typology Catalogue v0.1.1 (89 indicators, 20 typologies).
# indicator_id: the catalogue does not assign indicator IDs. The stable key used here is
#   <typology_id>-I<nn>, numbered in document order within each "Indicator set" table (I01 = first row).
#   If the catalogue is re-ordered, keys SHALL be kept and new indicators appended with the next number.
#
# origin (schemas/enums.yaml: source_mapping_origin)
#   EXTERNAL_SOURCE           indicator content is taken from an identified publication (requires `source`). None yet.
#   CS_AML_DESIGN_CONVENTION  the catalogue itself frames the indicator as a CS-AML construct (here: DISCONFIRMING
#                             indicators, per catalogue §0/§5/§6). No external source is claimed.
#   PENDING_VERIFICATION      origin not established. Typology-level "Primary reference lineage" is NOT per-indicator
#                             support (catalogue Annex A), so it is recorded in typology_lineage_refs, not in `source`.
# verification_status (schemas/enums.yaml: source_verification_status)
#   PENDING_VERIFICATION        no indicator-to-source mapping has been verified (all records at present).
#   PUBLICATION_LEVEL_VERIFIED  used only on `publications` entries whose existence/version the 2026-10-07 audit
#                               verified (Audit §8: S01, S08, S09). It is NOT section/page support for any indicator.
# source: only what the catalogue itself states; null where no per-indicator source is stated (all records at present).
# location: section/page. Always null: no page-level verification has been done. Do not add sections or pages
#   without checking the publication itself.
# OPEN METHODOLOGICAL TASK: per-indicator verification against the cited publications (section/page, adaptation
#   note), sample review by an investigator/AML specialist (audit finding A13). Until then no record may be cited
#   as external support for an indicator.
