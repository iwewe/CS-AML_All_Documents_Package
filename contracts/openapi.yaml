      x-csaml-cr:
      - CR-N-03
      - CR-N-05
      x-csaml-status: decided
      x-csaml-release-class: DECIDED_V0_1_4
  /cases/{caseId}/gates/{gateId}/submit:
    post:
      operationId: submitCaseGate
      summary: Submit gate for decision
      tags:
      - Cases
      description: If-Match carries the Gate record_version. Approval SHALL be independent where policy requires (403 otherwise). Unmet preconditions
        → 409 (details list the codes); G6 requires closure_reason. [v0.1.4 · CR-N-03, CR-N-05]
      parameters:
      - $ref: '#/components/parameters/caseId'
      - $ref: '#/components/parameters/gateId'
      - $ref: '#/components/parameters/XRequestID'
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GateDecisionRequest'
      responses:
        '200':
