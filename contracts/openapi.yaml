      description: 'Breadth-first, undirected expansion from readable seeds over readable canonical Relationships, ValueFlows / ValueFlowLegs
        (each with its own flow class) and Event participation. With case_id the walk stays inside that case; without it, it crosses into other
        cases only where the caller may read the objects. A seed the caller may not read answers the non-disclosing 404 (audited); a readable
