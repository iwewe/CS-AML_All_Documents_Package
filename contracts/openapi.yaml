        '503':
          $ref: '#/components/responses/DependencyUnavailable'
      security:
      - sessionCookie: []
        csrfHeader: []
  /cases/{caseId}/charter:
    get:
      operationId: getCaseCharter
      summary: Current charter + version history links
      tags:
