# CS-AML API — OpenAPI 3.1 contract. Version 0.1.4 — Approved Internal Specification Baseline (v0.1.4-spec; supersedes v0.1.3).
# Source of truth for prose semantics: Documents/CS-AML_API_Specification_v0.1.4.md and
# Documents/CS-AML_Data_Model_Specification_v0.1.4.md. Wire enums: schemas/enums.yaml.
# Contract choices not fixed by those specifications carry x-csaml-release-class (MUST_DECIDE_V0_1_1 / ACCEPT_DEFAULT_V0_1_1 / DEFER_V0_2 / DECIDED_V0_1_2 / DECIDED_V0_1_3 / DECIDED_V0_1_4).
openapi: 3.1.0
info:
  title: CS-AML API
  version: 0.1.4
  summary: Approved Internal Specification Baseline v0.1.4 (2026-10-10). Validated against the reference implementation only through its contract
    tests.
  description: |-
    Status: **Approved Internal Specification Baseline v0.1.4** (2026-10-10, tag `v0.1.4-spec`; supersedes v0.1.3). The P0 vertical slice of v0.1.1 plus the change requests approved by the product owner on 2026-10-09 (CR-I1-01…CR-I4-14, `CHANGELOG.md`): case memberships, back-channel logout, provenance traces, assets/ownership/control, events/timeline, value-flow view and legend, case graph, typology catalogue, indicators, typology matches, the hypothesis matrix, intelligence gaps and assessment revisions. v0.1.3 adds the change requests CR-I5-01…CR-I7-08 (`CHANGELOG.md`, v0.1.3): search, graph query and paths, product templates, rendering, frozen versions, corrections and withdrawal, review kinds and review requests, dissemination list and revocation, export package format, download and statuses, job status, retention rules, legal holds and disposition records, the canonical single-extract resource and the health probe. v0.1.4 adds the change requests CR-N-01…CR-N-14 (`CHANGELOG.md`, v0.1.4): charter version history and Annex A charter fields, gate status / transitions / preconditions / independence, task fields, rules and update, activity fields, OCR / text-extraction and offline machine-translation derivatives (DerivedText), derived text in search, job types, MFA step-up for high-risk actions (403 STEP_UP_REQUIRED, session assurance fields, `acr` login parameter) and 303 login-callback errors. Derived from `Documents/CS-AML_API_Specification_v0.1.4.md` (endpoints, conventions) and `Documents/CS-AML_Data_Model_Specification_v0.1.4.md` (fields, enums). Maintained contract-first; once an implementation exists, the schema generated from it is diffed against this file in CI (API §28).

    Conventions: wire enums are UPPER_SNAKE_CASE from the Data Model Annex A registry (`schemas/enums.yaml`); contract choices not fixed by the prose specifications carry `x-csaml-release-class`: MUST_DECIDE_V0_1_1 (decided, `x-csaml-status: decided`), ACCEPT_DEFAULT_V0_1_1 (frozen default, `accepted-default`; may evolve compatibly) or DEFER_V0_2 (`deferred`); items decided on 2026-10-09 carry DECIDED_V0_1_2 or DECIDED_V0_1_3, on 2026-10-10 DECIDED_V0_1_4 (`decided`) and `x-csaml-cr` with the change-request IDs. `x-csaml-ref-types` lists the permitted target classes of a reference field. Evaluation order: 401 → 403/404 → 400/428 → 412 → 422 → 409. Versioned resources return `ETag: "<record_version>"`; mutations send `If-Match`, except multi-entity commands (merge, unmerge, resolution decisions, match-candidate decisions), which send the body map `expected_versions` (412 carries details.current_record_versions). Idempotency-Key is REQUIRED for evidence ingest finalization, merge/unmerge, review/dissemination approval, export package generation, legal-hold release, disposition decisions and derived-text requests (text extraction, translation); SHOULD for creates.

    High-risk actions (`x-csaml-step-up`) need a recent second-factor verification (ACR 2 within the step-up window, default 900 s) and otherwise answer 403 STEP_UP_REQUIRED after the ordinary authorization checks. [v0.1.4 · CR-N-13]
  x-csaml-document-status: APPROVED_INTERNAL_SPECIFICATION_BASELINE
  license:
    name: Internal — not for external distribution
    identifier: LicenseRef-CSAML-Internal
servers:
- url: /api/v1
  description: Same-origin API behind Nginx; CORS disabled by default.
security:
- sessionCookie: []
tags:
- name: Auth
  description: Browser BFF session endpoints (served outside /api/v1).
- name: Cases
  description: Case register, charter, gates, tasks, activity (API §12).
- name: Sources
  description: Source registry (API §13).
- name: Evidence
  description: Evidence upload, metadata, content, extracts, lineage (API §13).
- name: Claims
  description: Source claims and their verification decisions (API §16A).
- name: Facts
  description: Facts supported by claims/evidence and verification decisions (API §16A).
- name: Entities
  description: Entities, match candidates, merge/unmerge and resolution decisions (API §14).
- name: Relationships
  description: First-class relationships (API §14).
- name: ValueFlows
  description: Value flows and legs with explicit flow_class (API §15).
- name: Hypotheses
  description: Competing hypotheses (API §16).
- name: Assessments
  description: Assessments, finalization, provenance (API §16).
- name: Products
  description: Intelligence products — six MVP templates (API §19).
- name: Reviews
  description: Review queue and decisions (API §19).
- name: Disseminations
  description: Dissemination approval, export packages, sharing log (API §19).
- name: Jobs
  description: Asynchronous jobs (API §22).
- name: Assets
  description: Assets, ownership interests, control assertions
- name: Timeline
  description: Events and the derived timeline
- name: Graph
  description: Derived case graph projection
- name: Typologies
  description: Typology catalogue, indicators and typology matches
- name: Search
  description: Permission-aware search over canonical objects (derived projection; API §17).
- name: Retention
  description: Retention rules, legal holds and the disposition workflow (API §20A).
- name: Operations
  description: Operational probes (API §20). /metrics is internal and not part of the API.
paths:
  /auth/login:
    get:
      operationId: authLogin
      summary: Start login (redirect to Keycloak)
      tags:
      - Auth
      description: 'Starts OIDC Authorization Code + PKCE with Keycloak (Django is the confidential client). No tokens reach the browser. `acr=2`
        requests a step-up (OIDC `acr_values=2`: password + one-time code); the callback records the verified `acr` and `auth_time` and audits
        `auth.step_up`. [v0.1.4 · CR-N-13]'
      parameters:
      - $ref: '#/components/parameters/AcrValue'
      - name: next
        in: query
        required: false
        description: Same-origin relative path to return to after sign-in (e.g. the page that asked for a step-up); any other value is replaced
          by `/`. [v0.1.4 · CR-N-13]
        schema:
          type: string
          maxLength: 512
        x-csaml-status: decided
        x-csaml-release-class: DECIDED_V0_1_4
        x-csaml-cr:
        - CR-N-13
      - $ref: '#/components/parameters/XRequestID'
      responses:
        '302':
          description: Redirect.
          headers:
            Location:
              $ref: '#/components/headers/Location'
        '429':
          $ref: '#/components/responses/RateLimited'
      security: []
      x-csaml-status: decided
      x-csaml-release-class: DECIDED_V0_1_4
      x-csaml-cr:
      - CR-N-13
    servers:
    - url: /
      description: Same origin, outside /api/v1 (API Specification §4).
  /auth/callback:
    get:
      operationId: authCallback
      summary: OIDC callback (code exchange, session creation)
      tags:
      - Auth
      parameters:
      - name: code
        in: query
        required: false
        schema:
          type: string
      - name: state
        in: query
        required: true
        schema:
          type: string
      - name: error
        in: query
        required: false
        schema:
          type: string
      - $ref: '#/components/parameters/XRequestID'
      responses:
        '302':
          description: Session created; redirect into the application. Sets `__Host-csaml_session` (HttpOnly; Secure; SameSite=Lax; Path=/; no
            Domain).
          headers:
            Location:
              $ref: '#/components/headers/Location'
            Set-Cookie:
              description: '`__Host-csaml_session=…; HttpOnly; Secure; SameSite=Lax; Path=/`'
              schema:
                type: string
        '303':
          $ref: '#/components/responses/LoginErrorRedirect'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
      security: []
      description: 'Success: 302 into the application (the `next` path of the login). Every failed callback answers 303 to `/?login_error=<expired|cancelled|failed|unavailable>`
        instead of a JSON error (replaces the 400 / 401 / 503 responses of v0.1.3). [v0.1.4 · CR-N-14]'
      x-csaml-status: decided
      x-csaml-release-class: DECIDED_V0_1_4
      x-csaml-cr:
      - CR-N-14
    servers:
    - url: /
      description: Same origin, outside /api/v1 (API Specification §4).
  /auth/logout:
    post:
      operationId: authLogout
      summary: Log out (destroy session, initiate IdP logout)
      tags:
      - Auth
      x-csaml-status: accepted-default
      description: 303 See Other to the IdP end-session endpoint (API §4 states only 'session destroyed; IdP logout initiated'). Because a cross-origin
        303 cannot be followed by fetch(), the browser SHALL perform logout as a top-level form POST (application/x-www-form-urlencoded) carrying
        the CSRF token as `csrfmiddlewaretoken`; API clients and tests may instead send the X-CSRFToken header. Same CSRF check, same 303. [v0.1.2
        · CR-I1-04]
      parameters:
      - $ref: '#/components/parameters/XRequestID'
      responses:
        '303':
          description: Session destroyed; redirect to the IdP end-session endpoint.
          headers:
            Location:
              $ref: '#/components/headers/Location'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
      security:
      - sessionCookie: []
        csrfHeader: []
      - sessionCookie: []
      x-csaml-release-class: ACCEPT_DEFAULT_V0_1_1
      requestBody:
        required: false
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                csrfmiddlewaretoken:
                  type: string
                  description: CSRF token (form variant).
              x-csaml-status: decided
              x-csaml-release-class: DECIDED_V0_1_2
              x-csaml-cr:
              - CR-I1-04
      x-csaml-cr:
      - CR-I1-04
    servers:
    - url: /
      description: Same origin, outside /api/v1 (API Specification §4).
  /auth/session:
    get:
      operationId: authGetSession
      summary: Current session (principal, expiry, coarse capabilities)
      tags:
      - Auth
      parameters:
      - $ref: '#/components/parameters/XRequestID'
      responses:
        '200':
          description: OK
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
      security:
      - sessionCookie: []
    servers:
    - url: /
      description: Same origin, outside /api/v1 (API Specification §4).
  /auth/backchannel-logout:
    post:
      operationId: authBackchannelLogout
      summary: OIDC back-channel logout (IdP → server)
      tags:
      - Auth
      description: OpenID Connect Back-Channel Logout 1.0. The IdP posts a signed logout_token (JWT); the server validates it (issuer, audience,
        signature, events claim, no nonce) and revokes the matching server-side sessions. CSRF-exempt and authenticated by the signed token only
        (no session cookie). [v0.1.2 · CR-I1-05]
      parameters:
      - $ref: '#/components/parameters/XRequestID'
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                logout_token:
                  type: string
                  description: Signed logout token (JWT).
              required:
              - logout_token
      responses:
        '200':
          description: Sessions revoked (or none matched).
          headers:
            Cache-Control:
              description: no-store
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
      security: []
      x-csaml-status: decided
      x-csaml-release-class: DECIDED_V0_1_2
      x-csaml-cr:
      - CR-I1-05
    servers:
    - url: /
      description: Same origin, outside /api/v1 (API Specification §4).
  /cases:
    get:
      operationId: listCases
      summary: Authorized case register
      tags:
      - Cases
      parameters:
      - $ref: '#/components/parameters/XRequestID'
      - $ref: '#/components/parameters/PageSize'
      - $ref: '#/components/parameters/PageAfter'
      - $ref: '#/components/parameters/Sort'
      - $ref: '#/components/parameters/ClassificationFilter'
      - $ref: '#/components/parameters/StatusFilter'
      responses:
        '200':
          description: OK
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'
      security:
      - sessionCookie: []
    post:
      operationId: createCase
      summary: Create case
      tags:
      - Cases
      parameters:
      - $ref: '#/components/parameters/XRequestID'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CaseCreate'
      responses:
        '201':
          description: Created
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
            ETag:
              $ref: '#/components/headers/ETag'
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Case'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/IdempotencyInProgress'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'
      security:
      - sessionCookie: []
        csrfHeader: []
  /cases/{caseId}:
    get:
      operationId: getCase
      summary: Canonical case detail
      tags:
      - Cases
      parameters:
      - $ref: '#/components/parameters/caseId'
      - $ref: '#/components/parameters/XRequestID'
      responses:
        '200':
          description: OK
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Case'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'
      security:
      - sessionCookie: []
    patch:
      operationId: updateCase
      summary: Version-aware case update
      tags:
      - Cases
      parameters:
      - $ref: '#/components/parameters/caseId'
      - $ref: '#/components/parameters/XRequestID'
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
