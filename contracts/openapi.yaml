  /reviews/{reviewId}/approve:
    post:
      operationId: approveReview
      summary: Independent approval
      tags:
      - Reviews
      description: 'Reviewer independent of the author where policy requires (403). Approving a rejected/closed review → 409. A repeat with the
        same key returns the same completed decision, never a duplicate. Idempotency-Key REQUIRED. SRS-FR-ASM-004: approving a review whose target
        is, or depends on, a high-impact or adverse assessment with no disconfirming_searches entry → 409 STATE_CONFLICT with details.reason =
        DISCONFIRMATION_REQUIRED.'
      parameters:
      - $ref: '#/components/parameters/reviewId'
      - $ref: '#/components/parameters/XRequestID'
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/IdempotencyKeyRequired'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewApproveRequest'
      responses:
        '200':
          description: OK
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
            ETag:
              $ref: '#/components/headers/ETag'
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Review'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 409 — STATE_CONFLICT (workflow state, or details.reason = DISCONFIRMATION_REQUIRED) or IDEMPOTENCY_IN_PROGRESS (Retry-After
            present).
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                state:
                  value:
                    error:
                      code: STATE_CONFLICT
                      message: This action is not allowed in the current state.
                      request_id: req_01HZYX5Q
                      details: {}
                      field_errors: {}
                disconfirmation:
                  value:
                    error:
                      code: STATE_CONFLICT
                      message: Record a disconfirming search on the assessment before approval.
                      request_id: req_01HZYX5Q
                      details:
                        reason: DISCONFIRMATION_REQUIRED
                        assessment_refs:
                        - 3c9e1f20-7a4b-4d2e-8f61-0b5a2c7d9e44
                      field_errors: {}
                inflight:
                  value:
                    error:
                      code: IDEMPOTENCY_IN_PROGRESS
                      message: An identical request is still being processed.
                      request_id: req_01HZYX5Q
                      details: {}
                      field_errors: {}
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'
      security:
      - sessionCookie: []
        csrfHeader: []
