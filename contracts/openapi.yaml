          description: 'Lifecycle status appropriate to the object class (UPPER_SNAKE_CASE). Object-specific status fields are documented on each
            resource. Classes with their own lifecycle mirror it (Claim claim_status, Fact fact_status, Entity resolution_status, Relationship
            relationship_status, OwnershipInterest interest_status, ControlAssertion assertion_status, Hypothesis status, Indicator status, IntelligenceGap
