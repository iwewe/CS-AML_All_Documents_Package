      summary: Charter version history (oldest first)
      tags:
      - Cases
      description: Every CharterVersion of the case with actor and time (SRS-FR-CASE-002 "prior version remains retrievable"). [v0.1.4 · CR-N-01]
      parameters:
      - $ref: '#/components/parameters/caseId'
      - $ref: '#/components/parameters/XRequestID'
      - $ref: '#/components/parameters/PageSize'
