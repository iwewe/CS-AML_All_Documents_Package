        until a new version is reviewed (assessment PEER_REVIEWED). 409 REVIEW_REQUIRED while an assessment in scope is flagged, or while the
        product is flagged unless clear_review_required = true. Authors, contributors and the requester can never decide (403). [v0.1.3 · CR-I6-03,
        CR-I6-04]'
