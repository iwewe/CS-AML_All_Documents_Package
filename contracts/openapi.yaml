      description: 'Creates a ResolutionDecision for the candidate''s subject entities: distinct → KEEP_SEPARATE, possible → POSSIBLE_MATCH, unresolved/defer
        → DEFER; same is recorded with POST /entities/merge (MERGE). Preconditions: body expected_versions (no If-Match); missing or incomplete
        map → 428 PRECONDITION_REQUIRED; any stale entry → 412 PRECONDITION_FAILED with details.current_record_versions.'
