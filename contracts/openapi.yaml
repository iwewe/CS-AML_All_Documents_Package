        written; leads are candidates, never facts, relationships or merges. Defaults: depth 2 (cap 3), 500 nodes, 1500 edges, 4 s wall clock,
        5 s statement timeout. Rate limit: 60 requests per minute per user (429 RATE_LIMITED). Leads (include_leads): readable entities in scope
        that record the same normalized identifier (same identifier type), phone, e-mail or address value (values are case-folded, accent-stripped
        and reduced to letters and digits; phone numbers to digits only; values shorter than 4 characters are ignored); status CANDIDATE, never
        an edge, never stored. [v0.1.3 · CR-I5-02, CR-I5-05, CR-I5-06, CR-I5-08]'
