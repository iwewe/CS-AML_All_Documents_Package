# CS-AML API — OpenAPI 3.1 contract. Version 0.1.2 — Approved Internal Specification Baseline (v0.1.2-spec; supersedes v0.1.1).
# Source of truth for prose semantics: Documents/CS-AML_API_Specification_v0.1.2.md and
# Documents/CS-AML_Data_Model_Specification_v0.1.2.md. Wire enums: schemas/enums.yaml.
# Contract choices not fixed by those specifications carry x-csaml-release-class (MUST_DECIDE_V0_1_1 / ACCEPT_DEFAULT_V0_1_1 / DEFER_V0_2 / DECIDED_V0_1_2).
openapi: 3.1.0
info:
  title: CS-AML API
  version: 0.1.2
  summary: Approved Internal Specification Baseline v0.1.2 (2026-10-09). Validated against the I1–I4 implementation only through its contract
    tests.
  description: |-
    Status: **Approved Internal Specification Baseline v0.1.2** (2026-10-09, tag `v0.1.2-spec`; supersedes v0.1.1). The P0 vertical slice of v0.1.1 plus the change requests approved by the product owner on 2026-10-09 (CR-I1-01…CR-I4-14, `CHANGELOG.md`): case memberships, back-channel logout, provenance traces, assets/ownership/control, events/timeline, value-flow view and legend, case graph, typology catalogue, indicators, typology matches, the hypothesis matrix, intelligence gaps and assessment revisions. Derived from `Documents/CS-AML_API_Specification_v0.1.2.md` (endpoints, conventions) and `Documents/CS-AML_Data_Model_Specification_v0.1.2.md` (fields, enums). Maintained contract-first; once an implementation exists, the schema generated from it is diffed against this file in CI (API §28).

    Conventions: wire enums are UPPER_SNAKE_CASE from the Data Model Annex A registry (`schemas/enums.yaml`); contract choices not fixed by the prose specifications carry `x-csaml-release-class`: MUST_DECIDE_V0_1_1 (decided, `x-csaml-status: decided`), ACCEPT_DEFAULT_V0_1_1 (frozen default, `accepted-default`; may evolve compatibly) or DEFER_V0_2 (`deferred`); items decided on 2026-10-09 carry DECIDED_V0_1_2 (`decided`) and `x-csaml-cr` with the change-request IDs. `x-csaml-ref-types` lists the permitted target classes of a reference field. Evaluation order: 401 → 403/404 → 400/428 → 412 → 422 → 409. Versioned resources return `ETag: "<record_version>"`; mutations send `If-Match`, except multi-entity commands (merge, unmerge, resolution decisions, match-candidate decisions), which send the body map `expected_versions` (412 carries details.current_record_versions). Idempotency-Key is REQUIRED for evidence ingest finalization, merge/unmerge, review/dissemination approval and export package generation; SHOULD for creates.
  x-csaml-document-status: APPROVED_INTERNAL_SPECIFICATION_BASELINE
  license:
    name: Internal — not for external distribution
    identifier: LicenseRef-CSAML-Internal
servers:
- url: /api/v1
  description: Same-origin API behind Nginx; CORS disabled by default.
security:
- sessionCookie: []
tags:
- name: Auth
  description: Browser BFF session endpoints (served outside /api/v1).
- name: Cases
  description: Case register, charter, gates, tasks, activity (API §12).
- name: Sources
  description: Source registry (API §13).
- name: Evidence
  description: Evidence upload, metadata, content, extracts, lineage (API §13).
- name: Claims
  description: Source claims and their verification decisions (API §16A).
- name: Facts
  description: Facts supported by claims/evidence and verification decisions (API §16A).
- name: Entities
  description: Entities, match candidates, merge/unmerge and resolution decisions (API §14).
- name: Relationships
  description: First-class relationships (API §14).
- name: ValueFlows
  description: Value flows and legs with explicit flow_class (API §15).
- name: Hypotheses
  description: Competing hypotheses (API §16).
- name: Assessments
  description: Assessments, finalization, provenance (API §16).
- name: Products
  description: Intelligence products — six MVP templates (API §19).
- name: Reviews
  description: Review queue and decisions (API §19).
- name: Disseminations
  description: Dissemination approval, export packages, sharing log (API §19).
- name: Jobs
  description: Asynchronous jobs (API §22).
- name: Assets
  description: Assets, ownership interests, control assertions
- name: Timeline
  description: Events and the derived timeline
- name: Graph
  description: Derived case graph projection
- name: Typologies
  description: Typology catalogue, indicators and typology matches
paths:
  /auth/login:
    get:
      operationId: authLogin
      summary: Start login (redirect to Keycloak)
      tags:
      - Auth
      description: Starts OIDC Authorization Code + PKCE with Keycloak (Django is the confidential client). No tokens reach the browser.
      parameters:
      - $ref: '#/components/parameters/XRequestID'
      responses:
        '302':
          description: Redirect.
          headers:
            Location:
              $ref: '#/components/headers/Location'
        '429':
          $ref: '#/components/responses/RateLimited'
      security: []
    servers:
    - url: /
      description: Same origin, outside /api/v1 (API Specification §4).
  /auth/callback:
    get:
      operationId: authCallback
      summary: OIDC callback (code exchange, session creation)
      tags:
      - Auth
      parameters:
      - name: code
        in: query
        required: false
        schema:
          type: string
      - name: state
        in: query
        required: true
        schema:
          type: string
      - name: error
        in: query
        required: false
        schema:
          type: string
      - $ref: '#/components/parameters/XRequestID'
      responses:
        '302':
          description: Session created; redirect into the application. Sets `__Host-csaml_session` (HttpOnly; Secure; SameSite=Lax; Path=/; no
            Domain).
          headers:
            Location:
              $ref: '#/components/headers/Location'
            Set-Cookie:
              description: '`__Host-csaml_session=…; HttpOnly; Secure; SameSite=Lax; Path=/`'
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'
      security: []
    servers:
    - url: /
      description: Same origin, outside /api/v1 (API Specification §4).
  /auth/logout:
    post:
      operationId: authLogout
      summary: Log out (destroy session, initiate IdP logout)
      tags:
      - Auth
      x-csaml-status: accepted-default
      description: 303 See Other to the IdP end-session endpoint (API §4 states only 'session destroyed; IdP logout initiated'). Because a cross-origin
        303 cannot be followed by fetch(), the browser SHALL perform logout as a top-level form POST (application/x-www-form-urlencoded) carrying
        the CSRF token as `csrfmiddlewaretoken`; API clients and tests may instead send the X-CSRFToken header. Same CSRF check, same 303. [v0.1.2
        · CR-I1-04]
      parameters:
      - $ref: '#/components/parameters/XRequestID'
      responses:
        '303':
          description: Session destroyed; redirect to the IdP end-session endpoint.
          headers:
            Location:
              $ref: '#/components/headers/Location'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
      security:
      - sessionCookie: []
        csrfHeader: []
      - sessionCookie: []
      x-csaml-release-class: ACCEPT_DEFAULT_V0_1_1
      requestBody:
        required: false
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                csrfmiddlewaretoken:
                  type: string
                  description: CSRF token (form variant).
              x-csaml-status: decided
              x-csaml-release-class: DECIDED_V0_1_2
              x-csaml-cr:
              - CR-I1-04
      x-csaml-cr:
      - CR-I1-04
    servers:
    - url: /
      description: Same origin, outside /api/v1 (API Specification §4).
  /auth/session:
    get:
      operationId: authGetSession
      summary: Current session (principal, expiry, coarse capabilities)
      tags:
      - Auth
      parameters:
      - $ref: '#/components/parameters/XRequestID'
      responses:
        '200':
          description: OK
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
      security:
      - sessionCookie: []
    servers:
    - url: /
      description: Same origin, outside /api/v1 (API Specification §4).
  /auth/backchannel-logout:
    post:
      operationId: authBackchannelLogout
      summary: OIDC back-channel logout (IdP → server)
      tags:
      - Auth
      description: OpenID Connect Back-Channel Logout 1.0. The IdP posts a signed logout_token (JWT); the server validates it (issuer, audience,
        signature, events claim, no nonce) and revokes the matching server-side sessions. CSRF-exempt and authenticated by the signed token only
        (no session cookie). [v0.1.2 · CR-I1-05]
      parameters:
      - $ref: '#/components/parameters/XRequestID'
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                logout_token:
                  type: string
                  description: Signed logout token (JWT).
              required:
              - logout_token
      responses:
        '200':
          description: Sessions revoked (or none matched).
          headers:
            Cache-Control:
              description: no-store
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
      security: []
      x-csaml-status: decided
      x-csaml-release-class: DECIDED_V0_1_2
      x-csaml-cr:
      - CR-I1-05
    servers:
    - url: /
      description: Same origin, outside /api/v1 (API Specification §4).
