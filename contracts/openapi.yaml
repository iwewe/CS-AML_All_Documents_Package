components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-csaml_session
      description: 'Server-side BFF session (Django confidential OIDC client of Keycloak, Authorization Code + PKCE). Cookie attributes: HttpOnly;
        Secure; SameSite=Lax; Path=/; no Domain. Access/refresh/ID tokens never reach JavaScript; `Authorization: Bearer` from browsers is rejected.
        Machine/service clients are out of MVP scope. Local development only: an explicitly isolated settings profile may rename the cookie and
        drop `Secure` for plain-http localhost; production settings always enforce `__Host-csaml_session` + Secure. [v0.1.2 · CR-I1-06]'
    csrfHeader:
      type: apiKey
      in: header
      name: X-CSRFToken
      description: 'Django CSRF token, REQUIRED on every unsafe method (POST/PUT/PATCH/DELETE); missing/invalid → 403. Delivery: the SPA reads
        `csrf_token` from GET /auth/session; the secret is kept in the server-side session and no JavaScript-readable CSRF cookie exists. POST
        /auth/logout may instead carry the token as the form field `csrfmiddlewaretoken` (top-level form navigation). [v0.1.2 · CR-I1-03, CR-I1-04]'
  parameters:
