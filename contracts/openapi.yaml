# CS-AML API — OpenAPI 3.1 contract, P0 vertical slice. Version 0.1.1 — DRAFT FOR REVIEW.
# Source of truth for prose semantics: Documents/CS-AML_API_Specification_v0.1.1.md and
# Documents/CS-AML_Data_Model_Specification_v0.1.1.md. Wire enums: schemas/enums.yaml.
# Items marked `x-csaml-status: proposed` are contract decisions not fixed by those specifications.
openapi: 3.1.0
info:
  title: CS-AML API — P0 vertical slice
  version: 0.1.1
  summary: Draft for review (proposed internal baseline). Not validated against an implementation.
  description: |-
    Status: **draft for review** (v0.1.1, proposed internal baseline). Hand-authored P0 vertical slice of the CS-AML API derived from `Documents/CS-AML_API_Specification_v0.1.1.md` (endpoints, conventions) and `Documents/CS-AML_Data_Model_Specification_v0.1.1.md` (fields, enums). Maintained contract-first; once an implementation exists, the schema generated from it is diffed against this file in CI (API §28).

    Conventions: wire enums are UPPER_SNAKE_CASE from the Data Model Annex A registry (`schemas/enums.yaml`); every schema/parameter/operation marked `x-csaml-status: proposed` is a contract decision not fixed by the specifications. Evaluation order: 401 → 403/404 → 400/428 → 412 → 422 → 409. Versioned resources return `ETag: "<record_version>"`; mutations send `If-Match`, except multi-entity commands (merge, unmerge, resolution decisions, match-candidate decisions), which send the body map `expected_versions` (412 carries details.current_record_versions). Idempotency-Key is REQUIRED for evidence ingest finalization, merge/unmerge, review/dissemination approval and export package generation; SHOULD for creates.
  x-csaml-document-status: DRAFT_FOR_REVIEW
  license:
    name: Internal — not for external distribution
    identifier: LicenseRef-CSAML-Internal
servers:
- url: /api/v1
  description: Same-origin API behind Nginx; CORS disabled by default.
security:
- sessionCookie: []
tags:
- name: Auth
  description: Browser BFF session endpoints (served outside /api/v1).
- name: Cases
  description: Case register, charter, gates, tasks, activity (API §12).
- name: Sources
  description: Source registry (API §13).
- name: Evidence
  description: Evidence upload, metadata, content, extracts, lineage (API §13).
- name: Claims
  description: Source claims and their verification decisions (API §16A).
- name: Facts
  description: Facts supported by claims/evidence and verification decisions (API §16A).
- name: Entities
  description: Entities, match candidates, merge/unmerge and resolution decisions (API §14).
- name: Relationships
  description: First-class relationships (API §14).
- name: ValueFlows
  description: Value flows and legs with explicit flow_class (API §15).
- name: Hypotheses
  description: Competing hypotheses (API §16).
- name: Assessments
  description: Assessments, finalization, provenance (API §16).
- name: Products
  description: Intelligence products — six MVP templates (API §19).
- name: Reviews
  description: Review queue and decisions (API §19).
- name: Disseminations
  description: Dissemination approval, export packages, sharing log (API §19).
- name: Jobs
  description: Asynchronous jobs (API §22).
paths:
  /auth/login:
    get:
      operationId: authLogin
      summary: Start login (redirect to Keycloak)
      tags:
      - Auth
      description: Starts OIDC Authorization Code + PKCE with Keycloak (Django is the confidential client). No tokens reach the browser.
      parameters:
      - $ref: '#/components/parameters/XRequestID'
      responses:
        '302':
          description: Redirect.
          headers:
            Location:
              $ref: '#/components/headers/Location'
        '429':
          $ref: '#/components/responses/RateLimited'
      security: []
    servers:
    - url: /
      description: Same origin, outside /api/v1 (API Specification §4).
  /auth/callback:
    get:
      operationId: authCallback
      summary: OIDC callback (code exchange, session creation)
      tags:
      - Auth
      parameters:
      - name: code
        in: query
        required: false
        schema:
          type: string
      - name: state
        in: query
        required: true
        schema:
          type: string
      - name: error
        in: query
        required: false
        schema:
          type: string
      - $ref: '#/components/parameters/XRequestID'
      responses:
        '302':
          description: Session created; redirect into the application. Sets `__Host-csaml_session` (HttpOnly; Secure; SameSite=Lax; Path=/; no
            Domain).
          headers:
            Location:
              $ref: '#/components/headers/Location'
            Set-Cookie:
              description: '`__Host-csaml_session=…; HttpOnly; Secure; SameSite=Lax; Path=/`'
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'
      security: []
    servers:
    - url: /
      description: Same origin, outside /api/v1 (API Specification §4).
  /auth/logout:
    post:
      operationId: authLogout
      summary: Log out (destroy session, initiate IdP logout)
      tags:
      - Auth
      x-csaml-status: proposed
      description: 'Proposed: 303 See Other to the IdP end-session endpoint (API §4 states only ''session destroyed; IdP logout initiated'').'
      parameters:
      - $ref: '#/components/parameters/XRequestID'
      responses:
        '303':
          description: Session destroyed; redirect to the IdP end-session endpoint.
          headers:
            Location:
              $ref: '#/components/headers/Location'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
      security:
      - sessionCookie: []
        csrfHeader: []
    servers:
    - url: /
      description: Same origin, outside /api/v1 (API Specification §4).
  /auth/session:
