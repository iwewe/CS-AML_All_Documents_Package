components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-csaml_session
      description: 'Server-side BFF session (Django confidential OIDC client of Keycloak, Authorization Code + PKCE). Cookie attributes: HttpOnly;
        Secure; SameSite=Lax; Path=/; no Domain. Access/refresh/ID tokens never reach JavaScript; `Authorization: Bearer` from browsers is rejected.
        Machine/service clients are out of MVP scope.'
    csrfHeader:
      type: apiKey
      in: header
      name: X-CSRFToken
      description: Django CSRF token, REQUIRED on every unsafe method (POST/PUT/PATCH/DELETE); missing/invalid → 403. How the SPA obtains the
        token is not yet specified.
  parameters:
    caseId:
      name: caseId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Ref'
      description: Case ID.
    gateId:
      name: gateId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Ref'
      description: Gate ID.
    sourceId:
      name: sourceId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Ref'
      description: Source ID.
    evidenceId:
      name: evidenceId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Ref'
      description: EvidenceItem ID.
    uploadId:
      name: uploadId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Ref'
      description: Upload session ID.
    claimId:
      name: claimId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Ref'
      description: Claim ID.
    factId:
      name: factId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Ref'
      description: Fact ID.
    entityId:
      name: entityId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Ref'
      description: Entity ID.
    candidateId:
      name: candidateId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Ref'
      description: Match candidate ID (API §14 writes {id}).
    mergeId:
      name: mergeId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Ref'
      description: 'ID of the MERGE ResolutionDecision being reversed (Proposed mapping: API §14 ''entity-merges/{mergeId}'').'
    relationshipId:
      name: relationshipId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Ref'
      description: Relationship ID.
    flowId:
      name: flowId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Ref'
      description: ValueFlow ID.
    hypothesisId:
      name: hypothesisId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Ref'
      description: Hypothesis ID (API §16 writes {id}).
    assessmentId:
      name: assessmentId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Ref'
      description: Assessment ID (API §16 writes {id}).
    productId:
      name: productId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Ref'
      description: IntelligenceProduct ID.
    reviewId:
      name: reviewId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Ref'
      description: Review ID.
    disseminationId:
      name: disseminationId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Ref'
      description: Dissemination ID (API §19 writes {id}).
    jobId:
      name: jobId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Ref'
      description: Job ID.
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: '`"<record_version>"` of the resource being changed. Missing → 428 PRECONDITION_REQUIRED; stale → 412 PRECONDITION_FAILED.
        Declared required: a request without it is rejected with 428.'
      schema:
        type: string
        pattern: ^"[0-9]+"$
        examples:
        - '"7"'
    IdempotencyKeyRequired:
      name: Idempotency-Key
      in: header
      required: true
      description: 'UUID. REQUIRED for this command (API §11). Scope (principal, method, route template + path params); retention 24 h. Same key
        + same payload → original result replayed with `Idempotent-Replayed: true`; different payload → 422 IDEMPOTENCY_KEY_REUSED; in flight
        → 409 IDEMPOTENCY_IN_PROGRESS + Retry-After. Proposed: a missing key → 400 INVALID_REQUEST (open item in API §11).'
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: UUID. SHOULD be sent on creates (MAY on other mutations) (API §11). Replay/reuse/in-flight semantics as for required keys.
      schema:
        type: string
        format: uuid
    XRequestID:
      name: X-Request-ID
      in: header
      required: false
      description: Optional client correlation ID; server generates one when absent.
      schema:
        type: string
        maxLength: 128
    PageSize:
      name: page[size]
      in: query
      required: false
      style: form
      explode: true
      description: Page size; default 50, maximum configurable; the server MAY lower it.
      schema:
        type: integer
        minimum: 1
        default: 50
    PageAfter:
      name: page[after]
      in: query
      required: false
      description: Opaque cursor from page.next_cursor of the previous page.
      schema:
        type: string
    Sort:
      name: sort
      in: query
      required: false
      description: Allowlisted sort field, `-` prefix for descending (e.g. `-updated_at`). Server applies a deterministic secondary sort. Per-resource
        allowlists are not yet specified.
      schema:
        type: string
        pattern: ^-?[a-z_]+$
        examples:
        - -updated_at
    CaseIdFilter:
      name: case_id
      in: query
      required: false
      description: Filter by case context.
      schema:
        $ref: '#/components/schemas/Ref'
    ClassificationFilter:
      name: classification
      in: query
      required: false
      style: form
      explode: false
      description: Comma-separated classification filter (e.g. RESTRICTED,SOURCE_PROTECTED).
      schema:
        type: array
        items:
          $ref: '#/components/schemas/Classification'
    StatusFilter:
      name: status
      in: query
      required: false
      style: form
      explode: false
      description: Comma-separated lifecycle status filter (UPPER_SNAKE_CASE values of the resource's status enum).
      schema:
        type: array
        items:
          type: string
    TypeFilter:
      name: type
      in: query
      required: false
      style: form
      explode: false
      description: Comma-separated type filter (UPPER_SNAKE_CASE values of the resource's type enum).
      schema:
        type: array
        items:
          type: string
    EntityTypeFilter:
      name: type
      in: query
      required: false
      style: form
      explode: false
      description: Comma-separated entity_type filter (e.g. ORGANIZATION).
      schema:
        type: array
        items:
          $ref: '#/components/schemas/EntityType'
    EntityResolutionStatusFilter:
      name: resolution_status
      in: query
      required: false
      style: form
      explode: false
      description: Comma-separated entity_resolution_status filter (e.g. RESOLVED).
      schema:
        type: array
        items:
          $ref: '#/components/schemas/EntityResolutionStatus'
  headers:
    ETag:
      description: '`"<record_version>"` of the returned versioned resource.'
      schema:
        type: string
        pattern: ^"[0-9]+"$
    IdempotentReplayed:
      description: '`true` when this response replays an earlier request with the same Idempotency-Key.'
      schema:
        type: string
        enum:
        - 'true'
    RetryAfter:
      description: Seconds (or HTTP-date) to wait before retrying.
      schema:
        type: string
    XRequestID:
      description: Correlation ID (echoed or server-generated).
      schema:
        type: string
    Location:
      description: Redirect target.
      schema:
        type: string
        format: uri-reference
  responses:
    BadRequest:
      description: 400 INVALID_REQUEST — malformed request, invalid header, body record_version ≠ If-Match, or missing REQUIRED Idempotency-Key
        (proposed).
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            invalid:
              value:
                error:
                  code: INVALID_REQUEST
                  message: The request could not be processed.
                  request_id: req_01HZYX5Q
                  details: {}
                  field_errors: {}
    Unauthorized:
      description: 401 AUTHENTICATION_REQUIRED — no valid session (also after logout, expiry or revocation).
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            unauth:
              value:
                error:
                  code: AUTHENTICATION_REQUIRED
                  message: Sign in to continue.
                  request_id: req_01HZYX5Q
                  details: {}
                  field_errors: {}
    Forbidden:
      description: 403 ACCESS_DENIED — not permitted, or missing/invalid X-CSRFToken on an unsafe method. Deployments choose 403 or 404 consistently
        (non-disclosing).
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            denied:
              value:
                error:
                  code: ACCESS_DENIED
                  message: You do not have access to this action.
                  request_id: req_01HZYX5Q
                  details: {}
                  field_errors: {}
    NotFound:
      description: 404 NOT_FOUND — absent or not disclosed to this principal.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            notfound:
              value:
                error:
                  code: NOT_FOUND
                  message: Not found.
                  request_id: req_01HZYX5Q
                  details: {}
                  field_errors: {}
    StateConflict:
      description: 409 STATE_CONFLICT — workflow/business-state conflict (never a stale version).
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            state:
              value:
                error:
                  code: STATE_CONFLICT
                  message: This action is not allowed in the current state.
                  request_id: req_01HZYX5Q
                  details: {}
                  field_errors: {}
    IdempotencyInProgress:
      description: 409 IDEMPOTENCY_IN_PROGRESS — a request with the same Idempotency-Key is still in flight.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestID'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            inflight:
              value:
                error:
                  code: IDEMPOTENCY_IN_PROGRESS
                  message: An identical request is still being processed.
                  request_id: req_01HZYX5Q
                  details: {}
                  field_errors: {}
    Conflict:
      description: 409 — either STATE_CONFLICT (workflow/business state) or IDEMPOTENCY_IN_PROGRESS (Retry-After present).
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestID'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            state:
              value:
                error:
                  code: STATE_CONFLICT
                  message: This action is not allowed in the current state.
                  request_id: req_01HZYX5Q
                  details: {}
                  field_errors: {}
            inflight:
              value:
                error:
                  code: IDEMPOTENCY_IN_PROGRESS
                  message: An identical request is still being processed.
                  request_id: req_01HZYX5Q
                  details: {}
                  field_errors: {}
    PreconditionFailed:
      description: 412 PRECONDITION_FAILED — If-Match is stale; no change was made.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PreconditionFailedError'
          examples:
            stale:
              value:
                error:
                  code: PRECONDITION_FAILED
                  message: The record changed after you opened it.
                  request_id: req_01HZYX5Q
                  details:
                    current_record_version: 8
                  field_errors: {}
    PreconditionFailedMulti:
      description: 412 PRECONDITION_FAILED — at least one entry of expected_versions is stale; no change was made. details.current_record_versions
        maps every subject entity to its current record_version.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PreconditionFailedMultiError'
          examples:
            stale:
              value:
                error:
                  code: PRECONDITION_FAILED
                  message: One or more records changed after you opened them.
                  request_id: req_01HZYX5Q
                  details:
                    current_record_versions:
                      5f0c2a7e-1b7d-4c1e-9a43-2a6f0b8e9d11: 5
                  field_errors: {}
    PreconditionRequiredMulti:
      description: 428 PRECONDITION_REQUIRED — expected_versions missing or does not cover every subject entity (checked before schema validation).
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            missing:
              value:
                error:
                  code: PRECONDITION_REQUIRED
                  message: Reload the records and try again.
                  request_id: req_01HZYX5Q
                  details: {}
                  field_errors: {}
    UnprocessableEntity:
      description: 422 — VALIDATION_FAILED (field/domain validation) or IDEMPOTENCY_KEY_REUSED (same key, different payload).
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            validation:
              value:
                error:
                  code: VALIDATION_FAILED
                  message: Some fields are invalid.
                  request_id: req_01HZYX5Q
                  details: {}
                  field_errors: {}
            reused:
              value:
                error:
                  code: IDEMPOTENCY_KEY_REUSED
                  message: This Idempotency-Key was used with a different request.
                  request_id: req_01HZYX5Q
                  details: {}
                  field_errors: {}
    PreconditionRequired:
      description: 428 PRECONDITION_REQUIRED — mutation of a versioned resource without If-Match.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            missing:
              value:
                error:
                  code: PRECONDITION_REQUIRED
                  message: Reload the record and try again.
                  request_id: req_01HZYX5Q
                  details: {}
                  field_errors: {}
    RateLimited:
      description: 429 RATE_LIMITED.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestID'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            rate:
              value:
                error:
                  code: RATE_LIMITED
                  message: Too many requests.
                  request_id: req_01HZYX5Q
                  details: {}
                  field_errors: {}
    InternalError:
      description: 500 INTERNAL_ERROR — safe generic message.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            internal:
              value:
                error:
                  code: INTERNAL_ERROR
                  message: Something went wrong.
                  request_id: req_01HZYX5Q
                  details: {}
                  field_errors: {}
    DependencyUnavailable:
      description: 503 DEPENDENCY_UNAVAILABLE — temporary backend dependency failure.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestID'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            dep:
              value:
                error:
                  code: DEPENDENCY_UNAVAILABLE
                  message: Service temporarily unavailable.
                  request_id: req_01HZYX5Q
                  details: {}
                  field_errors: {}
  schemas:
