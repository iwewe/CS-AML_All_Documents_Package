  /entities/merge:
    post:
      operationId: mergeEntities
      summary: Version-aware merge (creates a MERGE ResolutionDecision)
      tags:
      - Entities
      description: 'Absorbed records become MERGED (canonical_parent = surviving_entity_ref); survivor becomes RESOLVED. Precursor identifiers
        preserved; audit event emitted. Bulk merge is not supported. Reviewer ≠ decider for high-impact merges (403). Idempotency-Key REQUIRED.
        Preconditions: body expected_versions (no If-Match); missing or incomplete map → 428 PRECONDITION_REQUIRED; any stale entry → 412 PRECONDITION_FAILED
